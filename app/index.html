<!doctype html>
<html lang="fa" dir="rtl" data-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>DevNet Toolbox</title>
    <!--
      Self-hosted deliberately.

      Loading this from telegram.org makes the whole app depend on the user's
      own network being able to reach that domain: the in-app WebView browses
      through the user's connection, not through Telegram's transport. Where
      telegram.org is blocked or throttled, `window.Telegram` never appears,
      initData comes back empty and the app dies on a 401 — even though
      Telegram itself works fine. Serving it from our own origin removes that
      dependency (and one cross-origin round trip on every launch).
    -->
    <script src="/telegram-web-app.js?58"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
